<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cử Chỉ Học Tiếng Trung</title>
<style>
  :root {
    --bg: #fffdf9; --card: #ffffff; --ink: #3a3a3a; --muted: #8a8178;
    --orange: #f08a3c; --orange-soft: #fde7d4; --mint: #d8f0e3; --rose: #fadcdc;
    --line: #f1e4d6;
    --zh: "KaiTi", "STKaiti", "SimSun", "Songti SC", serif;
    --vi: "Times New Roman", "Noto Serif", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--vi); }
  header { display: flex; justify-content: space-between; align-items: center;
           padding: 12px 20px; border-bottom: 2px solid var(--orange-soft); }
  header h1 { margin: 0; font-size: 22px; font-weight: normal; }
  header h1 b { font-family: var(--zh); color: var(--orange); font-weight: normal; }
  .stats { font-size: 16px; color: var(--muted); }
  .stats b { color: var(--orange); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
         gap: 20px; padding: 20px; max-width: 1200px; margin: auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  /* Camera: video mirrored via CSS (cheap) – detection runs on raw frames. */
  .cam { position: relative; border-radius: 14px; overflow: hidden; background: #f6efe7;
         aspect-ratio: 4 / 3; border: 1px solid var(--line); }
  .cam video, .cam canvas { position: absolute; inset: 0; width: 100%; height: 100%;
                            object-fit: cover; transform: scaleX(-1); }
  .cam .hud { position: absolute; left: 10px; bottom: 10px; padding: 4px 10px;
              background: rgba(255,255,255,.85); border-radius: 8px; font-size: 14px; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
           padding: 24px; display: flex; flex-direction: column; gap: 16px; min-height: 360px; }
  .modes { display: flex; gap: 8px; }
  .modes button, .btn { font-family: var(--vi); font-size: 16px; padding: 8px 16px; cursor: pointer;
           border: 1px solid var(--orange); background: #fff; color: var(--orange); border-radius: 999px; }
  .modes button.active, .btn.primary { background: var(--orange); color: #fff; }
  .prompt { font-size: 18px; color: var(--muted); }
  .zh { font-family: var(--zh); font-size: 96px; line-height: 1.1; text-align: center; }
  .py { text-align: center; font-size: 22px; color: var(--orange); }
  .claim { text-align: center; font-size: 26px; }
  .choices { display: flex; justify-content: space-between; gap: 12px; }
  .choice { flex: 1; text-align: center; padding: 12px; border-radius: 12px; background: var(--orange-soft);
            font-family: var(--zh); font-size: 44px; }
  .choice small { display: block; font-family: var(--vi); font-size: 14px; color: var(--muted); }
  .hint { font-size: 15px; color: var(--muted); text-align: center; }
  .feedback { text-align: center; font-size: 22px; min-height: 32px; border-radius: 10px; padding: 6px;
              transition: background .25s; }
  .feedback.ok { background: var(--mint); } .feedback.bad { background: var(--rose); }
  .fade-in { animation: fade .35s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Start overlay */
  #start { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 14px; z-index: 10; text-align: center; padding: 16px; }
  #start h2 { font-family: var(--zh); font-size: 54px; font-weight: normal; color: var(--orange); margin: 0; }
  #start p { margin: 0; font-size: 18px; }
  #start .teacher { color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<div id="start">
  <h2>动动头，动动手</h2>
  <p>Trò chơi học tiếng Trung bằng cử chỉ (camera)</p>
  <p class="teacher">Cô giáo: Thuý Ngô</p>
  <button class="btn primary" id="btnStart">Bật camera &amp; bắt đầu</button>
  <p class="hint" id="loadMsg">Ảnh camera chỉ xử lý trên máy bạn, không gửi đi đâu.</p>
</div>

<header>
  <h1><b>汉语</b> · Cử Chỉ</h1>
  <div class="stats">Điểm: <b id="score">0</b> · Chuỗi: <b id="streak">0</b></div>
</header>

<main>
  <div class="cam">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="hud" id="hud">Đang tải…</div>
  </div>

  <section class="panel">
    <div class="modes">
      <button data-mode="head" class="active">A · Cử chỉ đầu</button>
      <button data-mode="hand">B · Đếm ngón tay</button>
    </div>
    <div id="card"></div>
    <div class="feedback" id="feedback"></div>
    <p class="hint">Bàn phím dự phòng: Y = gật · N = lắc · ← / → = nghiêng · 0–9 = số ngón</p>
  </section>
</main>

<script type="module" src="game-cu-chi.js"></script>
</body>
</html>
